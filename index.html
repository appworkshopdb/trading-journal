<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trading Journal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">Trading&nbsp;Journal</div>

    <nav class="period-nav" aria-label="Zeitraum">
      <button id="btnPrev" class="icon-btn" title="Zurück" aria-label="Zurück">&#8249;</button>
      <button id="btnPeriod" class="period-label" title="Zum heutigen Monat"></button>
      <select id="yearSelect" class="year-select" aria-label="Jahr"></select>
      <button id="btnNext" class="icon-btn" title="Vor" aria-label="Vor">&#8250;</button>
      <button id="btnToday" class="text-btn">Heute</button>
    </nav>

    <div class="view-toggle" role="tablist" aria-label="Ansicht">
      <button data-view="month" role="tab" class="active">Monat</button>
      <button data-view="year" role="tab">Jahr</button>
    </div>

    <div class="status" id="status"></div>
  </header>

  <main class="workspace" id="workspace">
    <section class="pane pane-calendar" id="calendarPane" aria-label="Kalender"></section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Ziehen zum Anpassen · Doppelklick = 50/50"></div>
    <section class="pane pane-side" id="sidePane" aria-label="Details">
      <nav class="side-tabs" id="sideTabs" role="tablist">
        <button data-tab="checklists" role="tab">Checklisten</button>
        <button data-tab="notes" role="tab">Notizen</button>
      </nav>
      <div class="side-content" id="sideContent"></div>
    </section>
  </main>

  <!-- Login (nur im Supabase-Modus sichtbar) -->
  <div id="authOverlay" class="overlay hidden">
    <form id="authForm" class="auth-card">
      <h2>Anmelden</h2>
      <p class="muted">Trading Journal · privater Zugang. Die Anmeldung ist nur einmal pro Gerät nötig.</p>
      <label>E-Mail <input type="email" name="email" autocomplete="username" required></label>
      <label>Passwort <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Anmelden</button>
      <p id="authError" class="error"></p>
    </form>
  </div>

  <!-- Tag-Popup: Gewinn, Verlust, Notiz, Farbe (Inhalt baut js/daymodal.js) -->
  <div id="dayModal" class="overlay hidden"></div>

  <!-- Bild-Vollansicht -->
  <div id="lightbox" class="overlay hidden"><img alt=""></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
