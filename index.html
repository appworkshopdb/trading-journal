<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="metaTheme" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trading Journal</title>
  <script>try{var t=localStorage.getItem("tj.theme");if(t==="light")document.documentElement.dataset.theme="light";}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="topbar">
    <div class="menu-wrap">
      <button id="btnMenu" class="icon-btn menu-btn" aria-label="Menü" aria-haspopup="true" aria-expanded="false" title="Menü">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div id="mainMenu" class="dropdown hidden" role="menu"></div>
    </div>
    <div class="brand">Trading&nbsp;Journal</div>
    <span id="marketPill" class="market-pill"></span>

    <div class="status" id="status">
      <span id="saveStatus"></span>
      <div class="profile-wrap">
        <button id="btnProfile" class="avatar" aria-label="Profil" aria-haspopup="true" aria-expanded="false" title="Profil"></button>
        <div id="profileMenu" class="dropdown right hidden" role="menu"></div>
      </div>
    </div>
  </header>

  <!-- Auswertungen (vorerst leer) -->
  <main class="analysis-page hidden" id="analysisPage" aria-label="Auswertungen"></main>

  <main class="workspace" id="workspace">
    <section class="pane pane-calendar" aria-label="Kalender">
    <div class="calbar">
      <nav class="period-nav" aria-label="Zeitraum">
        <button id="btnPrev" class="icon-btn" title="Zurück" aria-label="Zurück">&#8249;</button>
        <button id="btnPeriod" class="period-label" title="Zum heutigen Monat"></button>
        <select id="yearSelect" class="year-select" aria-label="Jahr"></select>
        <button id="btnNext" class="icon-btn" title="Vor" aria-label="Vor">&#8250;</button>
        <button id="btnToday" class="text-btn">Heute</button>
      </nav>

      <div class="view-toggle" role="tablist" aria-label="Ansicht">
        <button data-view="month" role="tab" class="active">Monat</button>
        <button data-view="year" role="tab">Jahr</button>
      </div>
    </div>
    <div class="calendar-body" id="calendarPane"></div>
    </section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Ziehen zum Anpassen · Doppelklick = 50/50"></div>
    <section class="pane pane-side" id="sidePane" aria-label="Details">
      <nav class="side-tabs" id="sideTabs" role="tablist">
        <button data-tab="checklists" role="tab">Checklisten</button>
        <button data-tab="notes" role="tab">Notizen</button>
      </nav>
      <div class="side-content" id="sideContent"></div>
    </section>
  </main>

  <!-- Login (nur im Supabase-Modus sichtbar) -->
  <div id="authOverlay" class="overlay hidden">
    <form id="authForm" class="auth-card">
      <h2 id="authTitle">Anmelden</h2>
      <p class="muted" id="authHint">Melde dich mit deiner E-Mail und deinem Passwort an. Das ist nur einmal pro Gerät nötig.</p>
      <label>E-Mail <input type="email" name="email" autocomplete="username" required></label>
      <label>Passwort <input type="password" name="password" id="authPw" autocomplete="current-password" minlength="6" required></label>
      <label id="authPw2Wrap" class="hidden">Passwort wiederholen <input type="password" name="password2" id="authPw2" autocomplete="new-password" minlength="6"></label>
      <button type="submit" class="primary" id="authSubmit">Anmelden</button>
      <p id="authError" class="error"></p>
      <button type="button" class="text-btn" id="authSwitch">Noch kein Konto? Registrieren</button>
    </form>
  </div>

  <!-- Tag-Popup: Gewinn, Verlust, Notiz, Farbe (Inhalt baut js/daymodal.js) -->
  <div id="dayModal" class="overlay hidden"></div>

  <!-- Bild-Vollansicht -->
  <div id="lightbox" class="overlay hidden"><img alt=""></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
